<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Big elliptical apple skin arc (left side, golden) -->
  <path
    d="
      M17,30
      a18,15 0 0,1 36,0
      a18,15 0 0,1 -36,0
      M20,30
      a15,12 0 0,1 30,0
      a15,12 0 0,1 -30,0
      Z
    "
    fill="#ffd966"
    stroke="#c1a045"
    stroke-width="1.7"
  />
  <!-- Apple flesh (main ellipse, shifted right) -->
  <ellipse cx="36" cy="30" rx="15" ry="12" fill="#fff6c7" stroke="#ffe8a1" stroke-width="1.5"/>
  <!-- Central core (lighter) -->
  <ellipse cx="36" cy="30" rx="6" ry="5" fill="#f5efd7" stroke="#e5dab6" stroke-width="0.8"/>
  <!-- Seeds, arranged in an oval -->
  <ellipse cx="40" cy="30" rx="1.1" ry="2.2" fill="#7b4a13"/>
  <ellipse cx="36" cy="33" rx="1" ry="1.8" fill="#7b4a13"/>
  <ellipse cx="32" cy="30" rx="1.1" ry="2.2" fill="#7b4a13"/>
  <!-- Tiny stem (top left) -->
  <rect x="23" y="16" width="3" height="8" rx="1.2" fill="#a47732" stroke="#7b4a13" stroke-width="0.6"/>
  <!-- Leaf 1 (top left) -->
  <ellipse cx="22" cy="15" rx="3" ry="1.3" fill="#90c763" stroke="#538d26" stroke-width="0.7" transform="rotate(-25 22 15)"/>
  <!-- Leaf 2 (top right) -->
  <ellipse cx="28" cy="13" rx="2.4" ry="1" fill="#aed87f" stroke="#538d26" stroke-width="0.7" transform="rotate(10 28 13)"/>
</svg>
