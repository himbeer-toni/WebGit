<svg width="60" height="68" viewBox="0 0 180 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer glow for visibility on dark backgrounds -->
  <ellipse cx="110" cy="85" rx="62" ry="62" fill="#f8f8ff" opacity="0.13"/>
  <!-- Crescent moon -->
  <circle cx="110" cy="85" r="59" fill="#f6f3e8"/>
  <circle cx="128" cy="78" r="53" fill="#1a1c24"/>
  <!-- Moon highlight -->
  <ellipse cx="120" cy="70" rx="17" ry="6.5" fill="#fdfaf3" opacity="0.22"/>
  <!-- Brighter craters -->
  <ellipse cx="125" cy="65" rx="4.5" ry="2" fill="#d8d6cc" opacity="0.4"/>
  <ellipse cx="104" cy="100" rx="3" ry="1.1" fill="#eae7db" opacity="0.23"/>
  <!-- Stars with more pop -->
  <circle cx="62" cy="62" r="2.6" fill="#ffe066" opacity="0.88"/>
  <circle cx="140" cy="50" r="1.6" fill="#ffe066" opacity="0.82"/>
  <circle cx="76" cy="83" r="1.2" fill="#fffde4" opacity="0.7"/>
  <circle cx="130" cy="38" r="1.8" fill="#ffe066" opacity="0.86"/>
  <!-- Moon outline for definition -->
  <ellipse cx="110" cy="85" rx="59" ry="59" fill="none" stroke="#b3b1a5" stroke-width="3"/>
</svg>
